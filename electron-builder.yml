appId: com.densz.app
productName: Densz
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**
  - dist-renderer/**
  - package.json
  # Dependencias exclusivas del backend web (src/server/**) — nunca las usa
  # el escritorio, no tienen que viajar en el instalador de Electron. El
  # binario pesado de Chromium de Puppeteer (~580MB) vive fuera del
  # proyecto (caché del usuario, ~/.cache/puppeteer) y nunca se empaqueta;
  # esto excluye el paquete npm en sí y el resto de los paquetes solo-web.
  - "!node_modules/puppeteer/**"
  - "!node_modules/puppeteer-core/**"
  - "!node_modules/@puppeteer/**"
  - "!node_modules/express/**"
  - "!node_modules/cookie-parser/**"
  # Del paquete de Supabase solo se usa @supabase/auth-js en escritorio
  # (login con Google, ver googleOAuthDesktop.ts) — el resto del SDK
  # completo (acceso a datos/tiempo real/archivos/funciones, que el
  # escritorio no usa porque habla con Postgres directo) queda afuera.
  - "!node_modules/@supabase/supabase-js/**"
  - "!node_modules/@supabase/postgrest-js/**"
  - "!node_modules/@supabase/realtime-js/**"
  - "!node_modules/@supabase/storage-js/**"
  - "!node_modules/@supabase/functions-js/**"
  - "!node_modules/@supabase/phoenix/**"
  # Dependencias transitivas de puppeteer-core (protocolo BiDi/WebSocket y
  # soporte de proxy para conectarse a Chromium) — confirmadas sin ningún
  # otro uso en el proyecto tras una extracción real del .asar empaquetado.
  - "!node_modules/chromium-bidi/**"
  - "!node_modules/devtools-protocol/**"
  - "!node_modules/@tootallnate/**"
  - "!node_modules/ws/**"
  - "!node_modules/bare-events/**"
  - "!node_modules/bare-fs/**"
  - "!node_modules/bare-path/**"
  - "!node_modules/bare-stream/**"
  - "!node_modules/bare-url/**"
  - "!node_modules/proxy-agent/**"
  - "!node_modules/http-proxy-agent/**"
  - "!node_modules/https-proxy-agent/**"
  - "!node_modules/pac-proxy-agent/**"
# A propósito NO se empaqueta `.env` acá (ver incidente 2026-10-27: un
# `extraResources: - .env` viejo metía el `.env` REAL de esta máquina de
# build — DATABASE_URL de producción, service role key de Supabase, claves
# de Stripe/Mercado Pago, etc. — dentro de CADA instalador, incluidos los
# que se suben a GitHub Releases, público). El `.env` de cada máquina con
# Densz instalado se coloca una sola vez a mano en la carpeta `resources`
# del instalador (nunca viaja en el build, nunca queda commiteado) — un
# instalador/actualización nuevo no la toca si no la declara acá.
win:
  target: nsis
  icon: build/icon.ico
  # Sin certificado de firma de código: se desactiva el paso de edición de
  # recursos del .exe (rcedit) para evitar que electron-builder intente
  # descargar su herramienta vendorizada de firma (winCodeSign), que en
  # Windows sin "Modo de desarrollador" falla al crear symlinks internos
  # que ni siquiera se usan para un build sin firmar. El instalador NSIS
  # igual queda con el ícono de Densz (lo aplica el propio NSIS).
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
asarUnpack:
  - "**/*.node"
# Auto-actualización (electron-updater, ver autoUpdaterService.ts): cada
# instalador nuevo se publica como GitHub Release de este mismo repo
# (público, así que el escritorio instalado no necesita ningún token para
# BAJAR actualizaciones — solo hace falta uno para PUBLICARLAS, ver
# "npm run release"). electron-builder sube automáticamente latest.yml +
# el .exe al crear la release cuando se le pasa --publish.
publish:
  provider: github
  owner: Valentinszymek
  repo: Densz
  # Sin esto, electron-builder sube todo pero deja la release como
  # BORRADOR (hallazgo real, 2026-10-20: tocó publicarla a mano desde
  # github.com) — invisible para electron-updater hasta publicarla. Con
  # esto, "npm run release" queda público solo, sin ese paso extra.
  releaseType: release
